# TechScope — isolated local WordPress stack.
# Project name comes from COMPOSE_PROJECT_NAME in .env (techscope), so this
# never touches the host Apache/MariaDB or any other compose project.
name: techscope

services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    # No `ports:` on purpose — the DB is reachable only on the internal
    # compose network, never published to the host.
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [techscope]

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', '${WP_SITE_URL}' );
        define( 'WP_SITEURL', '${WP_SITE_URL}' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'FS_METHOD', 'direct' );
    volumes:
      # WP core + uploads live in a named volume (container-owned, uid 33).
      - wp_core:/var/www/html
      # Only our own code is bind-mounted, so it stays owned by the host user.
      - ./wp-content/themes/techscope:/var/www/html/wp-content/themes/techscope
      - ./wp-content/plugins/techscope-core:/var/www/html/wp-content/plugins/techscope-core
      - ./tools:/var/www/html/wp-content/techscope-tools
    networks: [techscope]

  # WP-CLI — not started by `up`; run it on demand:
  #   docker compose run --rm cli wp <command>
  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/techscope:/var/www/html/wp-content/themes/techscope
      - ./wp-content/plugins/techscope-core:/var/www/html/wp-content/plugins/techscope-core
      - ./tools:/var/www/html/wp-content/techscope-tools
    networks: [techscope]

volumes:
  db_data:
  wp_core:

networks:
  techscope:
    name: techscope_net
