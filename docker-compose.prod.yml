# TechScope — production stack for an Oracle Cloud Always Free VM.
#
# Standalone rather than an override of docker-compose.yml, because Compose
# merges `ports:` lists rather than replacing them and production must publish
# nothing but Caddy. deploy/deploy.sh checks the image pins here against the
# development file so the two cannot drift apart unnoticed.
#
#   docker compose -f docker-compose.prod.yml up -d
name: techscope

services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    # No ports. Reachable only on the internal network.
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [techscope]

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', '${WP_SITE_URL}' );
        define( 'WP_SITEURL', '${WP_SITE_URL}' );
        define( 'WP_DEBUG', false );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'DISALLOW_FILE_MODS', true );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_AUTO_UPDATE_CORE', 'minor' );
        /* Caddy terminates TLS, so PHP only learns the scheme from the header. */
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_FOR'] ) ) {
            $$_SERVER['REMOTE_ADDR'] = strtok( $$_SERVER['HTTP_X_FORWARDED_FOR'], ',' );
        }
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/techscope:/var/www/html/wp-content/themes/techscope:ro
      - ./wp-content/plugins/techscope-core:/var/www/html/wp-content/plugins/techscope-core:ro
    networks: [techscope]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TECHSCOPE_DOMAIN: ${TECHSCOPE_DOMAIN}
      TECHSCOPE_TLS_EMAIL: ${TECHSCOPE_TLS_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [techscope]

  cli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/techscope:/var/www/html/wp-content/themes/techscope:ro
      - ./wp-content/plugins/techscope-core:/var/www/html/wp-content/plugins/techscope-core:ro
      - ./backups:/backups
    networks: [techscope]

volumes:
  db_data:
  wp_core:
  caddy_data:
  caddy_config:

networks:
  techscope:
    name: techscope_net
